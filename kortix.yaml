# yaml-language-server: $schema=https://kortix.com/schema/kortix.v2.schema.json
#
# A minimal, valid Kortix v2 manifest. It declares one agent and the two
# trigger types the platform supports: cron and webhook. Behavior lives in
# agents/researcher.md; this file sets governance only.
kortix_version: 2
default_agent: researcher

project:
  name: open-source-perplexity-computer-deploy
  description: A research and agent stack on Kortix.

env:
  required: []
  optional: [TAVILY_API_KEY]

agents:
  researcher:
    file: agents/researcher.md
    connectors: all
    secrets: all

triggers:
  - slug: morning-brief
    name: Morning research brief
    type: cron
    agent: researcher
    cron: '0 8 * * 1-5'
    prompt: |
      Research the day's developments in the topics this project tracks.
      Write a cited brief to reports/brief.md and open a change request
      against main.

  - slug: research-webhook
    name: On-demand research run
    type: webhook
    agent: researcher
    prompt: |
      Run the research brief for the topic in the webhook payload.
      Write the brief to reports/brief.md and open a change request.
